name: Cross-platform release builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.runtime }} release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            runtime: win-x64
            archive: zip
          - runner: ubuntu-22.04
            runtime: linux-x64
            archive: tar.gz
          - runner: macos-15-intel
            runtime: osx-x64
            archive: tar.gz
          - runner: macos-15
            runtime: osx-arm64
            archive: tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Install Linux GUI test display
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Verify release tag matches application version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $applicationVersion = (& python -c "from dota_disabler.version import VERSION; print(VERSION)").Trim()
          if ("v$applicationVersion" -ne "${{ github.ref_name }}") {
            throw "Tag '${{ github.ref_name }}' does not match application version '$applicationVersion'."
          }

      - name: Build and verify release
        if: runner.os != 'Linux'
        shell: pwsh
        run: ./scripts/build_release.ps1 -Python (Get-Command python).Source -Runtime '${{ matrix.runtime }}'

      - name: Build and verify Linux release
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run --auto-servernum pwsh -NoLogo -NoProfile -File ./scripts/build_release.ps1 -Python "$(command -v python)" -Runtime '${{ matrix.runtime }}'

      - name: Upload verified release
        uses: actions/upload-artifact@v6
        with:
          name: Dota2CosmeticDisabler-${{ github.ref_name }}-${{ matrix.runtime }}
          path: |
            artifacts/Dota2CosmeticDisabler-*-${{ matrix.runtime }}.${{ matrix.archive }}
            artifacts/Dota2CosmeticDisabler-*-${{ matrix.runtime }}.${{ matrix.archive }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Assemble draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Download every verified platform archive
        uses: actions/download-artifact@v6
        with:
          pattern: Dota2CosmeticDisabler-${{ github.ref_name }}-*
          path: release-assets
          merge-multiple: true

      - name: Verify release files and checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          application_version="$(python -c 'from dota_disabler.version import VERSION; print(VERSION)')"

          if [[ "$version" != "$application_version" ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match application version '$application_version'."
            exit 1
          fi

          for runtime_and_extension in \
            "win-x64:zip" \
            "linux-x64:tar.gz" \
            "osx-x64:tar.gz" \
            "osx-arm64:tar.gz"
          do
            runtime="${runtime_and_extension%%:*}"
            extension="${runtime_and_extension#*:}"
            archive="Dota2CosmeticDisabler-${version}-${runtime}.${extension}"
            test -f "release-assets/$archive"
            test -f "release-assets/$archive.sha256"
            (cd release-assets && sha256sum --check "$archive.sha256")
          done

          file_count="$(find release-assets -maxdepth 1 -type f | wc -l)"
          if [[ "$file_count" -ne 8 ]]; then
            echo "::error::Expected exactly four archives and four checksum files; found $file_count files."
            find release-assets -maxdepth 1 -type f -print
            exit 1
          fi

      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          existing_draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)"

          if [[ -z "$existing_draft" ]]; then
            create_args=(
              release create "$tag" "${assets[@]}"
              --title "Dota 2 Cosmetic Disabler $tag"
              --generate-notes
              --draft
              --verify-tag
            )
            if [[ "$tag" == *-* ]]; then
              create_args+=(--prerelease)
            fi
            gh "${create_args[@]}"
          elif [[ "$existing_draft" == "true" ]]; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            echo "::error::Refusing to overwrite the already-published release for $tag."
            exit 1
          fi
