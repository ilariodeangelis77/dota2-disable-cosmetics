name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-tests:
    name: Windows source tests
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Build compiled-resource helpers
        shell: pwsh
        run: |
          dotnet build .\tools\VpkExtractor\VpkExtractor.csproj --configuration Release --configfile .\NuGet.Config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build .\tools\ModelPatcher\ModelPatcher.csproj --configuration Release --configfile .\NuGet.Config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

