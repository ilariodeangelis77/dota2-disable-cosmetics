name: Windows release build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build self-contained Windows release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build and verify release
        shell: pwsh
        run: .\scripts\build_release.ps1 -Python (Get-Command python).Source

      - name: Upload verified release
        uses: actions/upload-artifact@v4
        with:
          name: Dota2CosmeticDisabler-${{ github.ref_name }}-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

